name: Prepare reviewed Debian candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: New candidate version
        required: true
        default: '0.1.0'
        type: string
permissions:
  contents: read
concurrency:
  group: debian-candidate-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE_VERSION: ${{ inputs.version }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build once, test exact image, inspect OCI and gate observed vulnerabilities
        run: bash scripts/release/prepare.sh "$RUNNER_TEMP/debian-candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: debian-candidate-${{ github.sha }}-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/debian-candidate/image.oci.tar
            ${{ runner.temp }}/debian-candidate/scan.json
            ${{ runner.temp }}/debian-candidate/database.json
            ${{ runner.temp }}/debian-candidate/exceptions.json
            ${{ runner.temp }}/debian-candidate/receipt.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
