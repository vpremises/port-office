name: Promote reviewed Debian candidate (disabled by default)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed immutable image version
        required: true
        default: '0.1.0'
        type: string
      candidate-run:
        description: Successful prepare-reviewed-base run for this exact main SHA
        required: true
        type: string
      expected-archive-sha256:
        description: Owner-reviewed OCI archive SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: debian-publication-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  promote:
    if: vars.CONTAINER_PUBLICATION_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN: ${{ inputs.candidate-run }}
      IMAGE_VERSION: ${{ inputs.version }}
      EXPECTED_ARCHIVE: ${{ inputs.expected-archive-sha256 }}
      CONTAINER_PUBLICATION_ENABLED: ${{ vars.CONTAINER_PUBLICATION_ENABLED }}
      CONTAINER_SOURCE_APPROVED_SHA: ${{ vars.CONTAINER_SOURCE_APPROVED_SHA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require exact owner approval and successful candidate producer
        run: |
          test "$CONTAINER_SOURCE_APPROVED_SHA" = "$GITHUB_SHA"
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]] || exit 2
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > "$RUNNER_TEMP/run.json"
          python3 - "$RUNNER_TEMP/run.json" <<'PYCODE'
          import json, os, sys
          run = json.load(open(sys.argv[1]))
          assert run['head_sha'] == os.environ['GITHUB_SHA']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['path'] == '.github/workflows/prepare-reviewed-base.yml'
          PYCODE
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: debian-candidate-${{ github.sha }}-${{ inputs.version }}
          run-id: ${{ inputs.candidate-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/debian-candidate
      - name: Install registry copy mechanism
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - name: Promote verified bytes without rebuilding or changing existing tags
        run: bash scripts/release/promote.sh "$RUNNER_TEMP/debian-candidate" "$EXPECTED_ARCHIVE" "$IMAGE_VERSION" "$GITHUB_SHA"
