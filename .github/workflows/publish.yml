name: Publish container images (disabled by default)
'on':
  workflow_dispatch: null
permissions:
  contents: read
env:
  IMAGE_NAMESPACE: ${{ vars.CONTAINER_NAMESPACE }}
jobs:
  bake-base:
    if: vars.CONTAINER_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Validate approved destination
      env:
        REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
        NAMESPACE: ${{ vars.CONTAINER_NAMESPACE }}
      run: test -n "$REGISTRY" && test -n "$NAMESPACE" && test "${NAMESPACE%%/*}"
        = "$REGISTRY"
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ${{ vars.CONTAINER_REGISTRY }}
        username: ${{ secrets.CONTAINER_USERNAME }}
        password: ${{ secrets.CONTAINER_TOKEN }}
    - uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4
      with:
        push: true
        targets: default
  bake-apps:
    if: vars.CONTAINER_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Validate approved destination
      env:
        REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
        NAMESPACE: ${{ vars.CONTAINER_NAMESPACE }}
      run: test -n "$REGISTRY" && test -n "$NAMESPACE" && test "${NAMESPACE%%/*}"
        = "$REGISTRY"
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ${{ vars.CONTAINER_REGISTRY }}
        username: ${{ secrets.CONTAINER_USERNAME }}
        password: ${{ secrets.CONTAINER_TOKEN }}
    - uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4
      with:
        push: true
        targets: frappe
    needs: bake-base
  bake-iac:
    if: vars.CONTAINER_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Validate approved destination
      env:
        REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
        NAMESPACE: ${{ vars.CONTAINER_NAMESPACE }}
      run: test -n "$REGISTRY" && test -n "$NAMESPACE" && test "${NAMESPACE%%/*}"
        = "$REGISTRY"
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ${{ vars.CONTAINER_REGISTRY }}
        username: ${{ secrets.CONTAINER_USERNAME }}
        password: ${{ secrets.CONTAINER_TOKEN }}
    - uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4
      with:
        push: true
        targets: iac
