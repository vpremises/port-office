name: Release reviewed Debian image from version tag
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/tag-release.json', '.github/image-release.json', '.github/scripts/**', '.github/workflows/release-tag.yml', 'scripts/release/promote.sh']
permissions:
  contents: read
concurrency:
  group: oci-tag-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 .github/scripts/test_source_admission.py
  prepare:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      archive-sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Admit owned tag and successful main source
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/source_admission.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build once and require the existing exact-image CVE gate
        env:
          IMAGE_VERSION: ${{ steps.plan.outputs.version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: bash scripts/release/prepare.sh "$RUNNER_TEMP/debian-candidate"
      - name: Bind exact accepted archive
        id: hash
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/debian-candidate/image.oci.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: oci-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/debian-candidate/
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: prepare
    if: vars.CONTAINER_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ghcr-public
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require effective per-execution Environment review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/ghcr-public" --jq '.protection_rules | any(.type == "required_reviewers" and (.reviewers | length > 0))' | grep -qx true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/debian-candidate
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - name: Promote exact reviewed bytes and verify anonymous digest
        env:
          GH_TOKEN: ${{ github.token }}
          CONTAINER_PUBLICATION_ENABLED: ${{ vars.CONTAINER_PUBLICATION_ENABLED }}
          CONTAINER_SOURCE_APPROVED_SHA: ${{ github.sha }}
          IMAGE_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_ARCHIVE: ${{ needs.prepare.outputs.archive-sha256 }}
        run: bash scripts/release/promote.sh "$RUNNER_TEMP/debian-candidate" "$EXPECTED_ARCHIVE" "$IMAGE_VERSION" "$GITHUB_SHA"
