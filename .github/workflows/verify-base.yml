name: Verify independent Debian base
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-base:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Inspect build definition
        run: ./local-build.sh base-debian --print
      - name: Verify candidate integrity and fail-closed release policy
        run: |
          python3 -m unittest discover -s tests/release -v
          bash -n scripts/release/prepare.sh scripts/release/promote.sh
          python3 -m py_compile scripts/release/*.py
      - name: Build candidate without registry publication
        run: ./local-build.sh base-debian --load
      - name: Verify isolated image contract
        run: ./tests/verify-base.sh
      - name: Record local candidate identity
        run: docker image inspect ghcr.io/vpremises/base-debian:0.1.0 --format '{{json .Id}} {{json .Config.Labels}}'
